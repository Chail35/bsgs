name: temporary p5107 non-generic dispatcher 20260724
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/p5107-non-generic-levers-20260724
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy==1.13.3
      - name: Run all experiments
        run: |
          set -o pipefail
          python research/p5107_non_generic_levers/run_experiments.py | tee research/p5107_non_generic_levers/outputs/stdout.txt
      - name: Show receipts
        if: always()
        run: |
          find research/p5107_non_generic_levers/outputs -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          cat research/p5107_non_generic_levers/outputs/p5107_non_generic_levers_20260724.zip.sha256 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5107-non-generic-levers-20260724
          path: research/p5107_non_generic_levers/outputs/
          if-no-files-found: error
          retention-days: 30
